name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install python deps
        run: python -m pip install -r requirements.txt pytest
      - name: Smoke tests
        run: python -m pytest -q tests
      - name: Syntax checks
        shell: bash
        run: |
          bash -n install.sh
          node --check skills/reelforge-runner/scripts/record_auto.mjs
          python -m py_compile skills/reelforge/scripts/*.py
          python -m py_compile skills/reelforge-runner/scripts/*.py
