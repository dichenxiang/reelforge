# reelforge 编排配置
# 只在总控侧读；写稿/执行 skill 各自有自己的默认值。

# 运行模式：trio = WorkBuddy 当总控；duo = 人在前，执行 agent 自己当总控
mode: trio

modes:
  trio:
    orchestrator: workbuddy
    skills: [reelforge, reelforge-writer, reelforge-runner]
    特点: 全自动派活与轮询，手机可看，适合批量
  duo:
    orchestrator: human            # 人当总控
    skills: [reelforge-duo, reelforge-writer, reelforge-runner]
    特点: 人在电脑前，当面拍板，适合一次性高质量产出

roles:
  orchestrator:
    agent: workbuddy           # 任意能开会话、能读写文件的 agent
    skill: reelforge
  writer:
    agent: antigravity         # 只负责写稿 + 出图
    skill: reelforge-writer
    model: gemini-4-argon-medium
    reasoning: low
  runner:
    agent: deepseek-harness    # 只负责 wvp 工程与音频
    skill: reelforge-runner
    # 模型来源：deepseek-account 官方（默认）；可切 workbuddy / workbuddy-global
    provider: deepseek-account
    # 官方 API 里 V4.1 Flash 的 id 是 deepseek-flash（不是 deepseek-v4.1-flash）
    model: deepseek-flash
    reasoning: max
    team: true                 # 第 2..N 章用 /agent-teams 并行

gates:
  - style_gate                 # 风格/模板选择（写稿之前）
  - script_gate                # 口播稿确认（必须先过这一关）
  - pilot_gate                 # 15–20 秒样片验收（全篇之前）
  - audio_gate                 # 音频确认
  - final_gate                 # 成片验收

reference:
  target: 40                   # 默认参考度
  max: 60                      # 硬上限，超了必须重写

video:
  aspect: "16:9"               # wvp 固定 1920×1080
  fps: 30
  max_duration_sec: 1200

fx:
  # 稿子 → 动效：script_gate 之后、pilot_gate 之前必须跑，人只做否决
  planner: scripts/fx_pipeline.py
  runtime: effects/runtime.py
  index: effects/index.json          # 本地 + 仓库合并，仓库条目优先
  match:
    threshold: 2.6                   # 低于此分回基础文字动效，不硬套卡
    trans_every: 3                  # 每 3 拍插一个转场，不逐句插
    data_requires_numbers: true     # 没数字/量词不许上结构性图表
  verify: fx_pipeline.py check       # 全库逐帧回归，必须 0 异常
  ffmpeg: REELFORGE_FFMPEG          # 未设置时 runtime 自己找 PATH / ~/.local/bin / imageio_ffmpeg

paths:
  wvp: vendor/web-video-presentation
  library: ~/.reelforge/library    # 素材库，REELFORGE_LIBRARY 可覆盖
  effects: ~/.reelforge/effects    # 效果库，REELFORGE_EFFECTS 可覆盖
  skill_home: REELFORGE_HOME       # 项目侧定位 skill（make.py 的 fx 分支用）
  # 换 agent 后先跑 `python scripts/effects.py where` / `assets.py where` 取绝对路径
